    .payment-card.daviplata { border-left-color: #ef4123; }

    .btn-whatsapp:hover { background-color: #1ebd58; }
    
    /* MODAL / PANEL DE ADMINISTRACIÓN */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; overflow-y: auto; padding: 15px; }
    .modal-content { background: white; max-width: 550px; margin: 30px auto; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-header h2 { margin: 0; font-size: 1.3rem; color: #333; }
    .close-modal { font-size: 1.5rem; cursor: pointer; border: none; background: none; color: #999; }
    
    .form-group { display: block; margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; color: #557; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; font-family: inherit; }
    textarea { resize: vertical; height: 60px; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }

    .btn-cancel { background: #6c757d; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .admin-actions { display: flex; gap: 8px; margin-left: 10px; }
    .btn-action-del { background: #dc3545; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-action-edit { background: #ffc107; color: black; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    
    .admin-section-divider { margin: 25px 0 15px 0; border-top: 2px dashed #eee; padding-top: 15px; }
    
    footer { text-align: center; padding: 25px 15px; font-size: 0.8rem; color: #777; background: #e9ecef; border-top: 1px solid #dee2e6; }
    .creditos { font-weight: bold; color: #555; margin-top: 5px; }
